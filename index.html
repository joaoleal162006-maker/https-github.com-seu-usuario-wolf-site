<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WOLF Black Edition — loja premium." />
  <title>WOLF / BLACK EDITION</title>
  <style>
    :root{--bg:#050505;--panel:#101010;--gold:#d4af5d;--gold2:#f4d995;--text:#f5f1ea;--muted:#bdb29c;--line:rgba(212,175,93,.34)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;min-height:100vh;color:var(--text);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 0,rgba(212,175,93,.12),transparent 30%),linear-gradient(135deg,#030303,#111)}
    .store{width:min(100% - 32px,720px);margin:28px auto;background:rgba(9,9,9,.96);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 25px 80px #000;}
    header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #ffffff0d}.brand{color:var(--gold2);font-size:.8rem;font-weight:700;letter-spacing:.45em;text-transform:uppercase}.age{padding:8px 13px;border:1px solid #d4af5d66;border-radius:30px;color:var(--gold2);font-size:.7rem;letter-spacing:.16em;font-weight:bold}
    main{padding:42px 24px 30px;text-align:center}.mark{font-size:4rem;filter:drop-shadow(0 0 18px #d4af5d44)}h1{margin:14px 0 0;font-size:clamp(1.8rem,6vw,3.2rem);letter-spacing:.12em;text-transform:uppercase;line-height:1.1}.tagline{margin:15px 0 38px;color:var(--gold2);font-size:.72rem;letter-spacing:.38em;text-transform:uppercase;font-weight:bold}
    .title{margin:0 0 18px;color:var(--gold2);font-size:.8rem;letter-spacing:.4em;text-transform:uppercase}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product{min-height:130px;display:flex;align-items:center;justify-content:center;padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#d4af5d1f,#ffffff03);color:var(--text);text-decoration:none;font-weight:bold;letter-spacing:.14em;text-transform:uppercase;transition:.2s}.product:hover{transform:translateY(-4px);border-color:#d4af5dcc;box-shadow:0 15px 30px #000}.actions{margin-top:28px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.button{display:inline-block;padding:14px 24px;border-radius:30px;border:1px solid #d4af5d73;color:var(--gold2);text-decoration:none;font-size:.72rem;font-weight:bold;letter-spacing:.18em;text-transform:uppercase}.primary{background:linear-gradient(180deg,#d4af5d2b,#d4af5d0d)}footer{padding:22px;text-align:center;border-top:1px solid #ffffff0d}.label{margin-bottom:9px;color:var(--muted);font-size:.68rem;letter-spacing:.3em;text-transform:uppercase}.instagram{color:var(--gold2);font-weight:bold;text-decoration:none;letter-spacing:.1em}
    @media(max-width:560px){.products{grid-template-columns:1fr}.product{min-height:75px}.brand{letter-spacing:.2em}main{padding-top:32px}}
  </style>
</head>
<body>
  <div class="store">
    <header><div class="brand">WOLF</div><div class="age">18+</div></header>
    <main>
      <div class="mark">🐺</div>
      <h1>WOLF / BLACK EDITION</h1>
      <p class="tagline">Premium Vape</p>
      <h2 class="title">Catálogo</h2>
      <section class="products" aria-label="Catálogo de produtos">
        <a class="product" href="#">Ignite</a>
        <a class="product" href="#">Elfbar</a>
        <a class="product" href="#">Lost Vape</a>
      </section>
      <div class="actions"><a class="button primary" href="https://instagram.com/wolffpodds" target="_blank" rel="noopener">Instagram</a><a class="button" href="#">Voltar</a></div>
    </main>
    <footer><div class="label">Siga-nos</div><a class="instagram" href="https://instagram.com/wolffpodds" target="_blank" rel="noopener">@wolffpodds</a></footer>
  </div>
</body>
</html>
